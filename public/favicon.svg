<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">MindGuard – calm mental health icon</title>
  <desc id="desc">Rounded square with a gradient background and a simple heart-brain symbol.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg)" />

  <!-- Subtle inner glow -->
  <circle cx="32" cy="32" r="18" fill="#020617" fill-opacity="0.18" />

  <!-- Heart / brain combo -->
  <path
    fill="none"
    stroke="url(#heart)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M24 26c0-2.2 1.7-4 3.9-4 1.4 0 2.6.7 3.4 1.8.8-1.1 2-1.8 3.4-1.8 2.2 0 3.9 1.8 3.9 4 0 4.2-3.6 7.1-7.3 9.8L32 37l-.3-.2C27.6 33.1 24 30.2 24 26Z"
  />

  <!-- Minimal brain curves -->
  <path
    d="M27.5 24.5c-1 0-1.8.8-1.8 1.8 0 .9.6 1.6 1.4 1.8M36.5 24.5c1 0 1.8.8 1.8 1.8 0 .9-.6 1.6-1.4 1.8"
    fill="none"
    stroke="#fefce8"
    stroke-width="1.5"
    stroke-linecap="round"
  />
</svg>

